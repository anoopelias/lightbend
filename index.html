<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightBend</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="logo">LightBend</div>
    </header>

    <div class="board-column">
      <div class="board-toolbar">
        <!-- Slots are generated in JS (DragController.rebuildPaletteSlots),
             sized to fit each level's own tool count. -->
        <div class="palette"></div>

        <div class="level-controls">
          <button id="theme-toggle" class="reset-btn" title="Switch theme" aria-label="Switch theme"></button>
          <button id="reset-progress" class="reset-btn" title="Clear saved progress" aria-label="Clear saved progress">🗑</button>

          <div class="level-nav">
            <button id="prev-level" class="prev-level-btn" disabled title="Previous level" aria-label="Previous level">&larr;</button>
            <div class="level-select-wrap">
              <select id="level-select" class="level-select"></select>
            </div>
            <button id="next-level" class="next-level-btn" disabled title="Next level" aria-label="Next level">&rarr;</button>
          </div>
        </div>
      </div>

      <div class="board-shell">
        <canvas id="board"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="src/render.js"></script>
</body>
</html>
