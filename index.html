<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>raybend</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="logo">raybend</div>
      <p class="tagline">Bend the light</p>
    </header>

    <div class="toolbar">
      <div class="palette">
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
        <div class="palette-slot palette-slot--empty"></div>
      </div>

      <div class="level-nav">
        <button id="prev-level" class="prev-level-btn" disabled>&larr; Previous</button>
        <button id="next-level" class="next-level-btn" disabled>Next Level &rarr;</button>
      </div>
    </div>

    <div class="board-shell">
      <canvas id="board"></canvas>
    </div>
  </div>

  <script type="module" src="src/render.js"></script>
</body>
</html>
